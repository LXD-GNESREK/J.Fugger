spring.application.name=ledgerly

spring.datasource.url=jdbc:h2:mem:ledgerly;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=never

server.error.whitelabel.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

app.cookie.secure=true

# Brute-Force-Schutz (Issue 2.3)
# Account-basiert: nach 5 Fehlversuchen Sperre, danach exponentiell (1, 2, 4, 8, 15 min)
app.security.login.max-failures=5
app.security.login.base-lock=PT1M
app.security.login.max-lock=PT15M
# IP-basiert fuer /api/auth/login, /refresh, /password-reset
app.security.rate-limit.per-minute=20
app.security.rate-limit.per-hour=200



